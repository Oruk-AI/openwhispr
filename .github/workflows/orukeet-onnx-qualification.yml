name: Orukeet ONNX qualification

on:
  push:
    branches: [codex/orukeet-sherpa-qualification-20260910]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sherpa-integration:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install app dependencies
        run: npm ci
      - name: Download the bundled sherpa-onnx runtime
        run: npm run download:sherpa-onnx
      - name: Fetch the public speech fixture
        shell: bash
        run: curl --fail --location --retry 3 https://raw.githubusercontent.com/Oruk-AI/orukeet/main/demos/fixtures/jfk.wav --output jfk.wav
      - name: Exercise the production model manager (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: xvfb-run -a npx electron scripts/qa/orukeet-onnx-smoke.cjs --no-sandbox --audio jfk.wav --output orukeet-onnx-result.json --model orukeet-v0.1.0-q8
      - name: Exercise the production model manager (macOS and Windows)
        if: runner.os != 'Linux'
        run: npx electron scripts/qa/orukeet-onnx-smoke.cjs --audio jfk.wav --output orukeet-onnx-result.json --model orukeet-v0.1.0-q8
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: orukeet-onnx-${{ matrix.os }}
          path: orukeet-onnx-result.json
          if-no-files-found: warn
